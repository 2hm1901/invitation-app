<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#fdfcf7"/>
  <!-- Mortarboard base (square board) -->
  <polygon points="32,12 58,24 32,36 6,24" fill="#b3915f"/>
  <!-- Cap top shine -->
  <polygon points="32,12 58,24 32,36 6,24" fill="none" stroke="#d4b88c" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Rim of hat (cylinder) -->
  <path d="M18,28 L18,40 Q32,46 46,40 L46,28 Q32,34 18,28 Z" fill="#9a7b4f"/>
  <!-- Tassel string -->
  <line x1="52" y1="24" x2="52" y2="38" stroke="#d4b88c" stroke-width="2" stroke-linecap="round"/>
  <!-- Tassel end -->
  <circle cx="52" cy="40" r="3" fill="#d4b88c"/>
  <line x1="49" y1="42" x2="47" y2="48" stroke="#d4b88c" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="52" y1="43" x2="52" y2="49" stroke="#d4b88c" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="55" y1="42" x2="57" y2="48" stroke="#d4b88c" stroke-width="1.5" stroke-linecap="round"/>
</svg>
